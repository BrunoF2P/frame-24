version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/**/repo/queries.sql"
    gen:
      go:
        package: "repo"
        out: "internal/platform/db/gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "numeric"
            go_type: "string"
